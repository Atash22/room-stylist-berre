<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Room Stylist — Live Demo</title>
<style>
  :root {
    --ink: #2c2620;
    --paper: #efe8dc;
    --panel: #ffffff;
    --clay: #a8542f;
    --clay-dark: #8a4324;
    --line: #d9cfbd;
    --muted: #7a7263;
    --good: #4a6a4d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Iowan Old Style', 'Georgia', serif;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 56px 24px;
  }
  .wrap { max-width: 760px; width: 100%; }

  .eyebrow {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--clay);
    margin-bottom: 10px;
  }
  h1 {
    font-size: 40px;
    line-height: 1.08;
    margin: 0 0 8px;
    font-weight: 600;
  }
  .sub {
    color: var(--muted);
    font-size: 16px;
    margin: 0 0 36px;
    max-width: 52ch;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 32px;
  }

  .drop {
    border: 1.5px dashed var(--line);
    border-radius: 2px;
    padding: 28px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
    position: relative;
  }
  .drop:hover, .drop.has-file { border-color: var(--clay); background: #fbf7f0; }
  .drop input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer;
  }
  .drop-label { font-size: 14px; color: var(--muted); }
  .drop-label strong { color: var(--ink); }

  #preview {
    max-width: 100%;
    max-height: 220px;
    margin: 0 auto 14px;
    border-radius: 2px;
    display: none;
  }

  button {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    background: var(--clay);
    color: #fff;
    border: none;
    border-radius: 2px;
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: var(--clay-dark); }
  button:disabled { background: #c7bda9; cursor: not-allowed; }

  .error {
    margin-top: 18px;
    padding: 14px 16px;
    background: #fbeee8;
    border: 1px solid #e3b8a4;
    color: var(--clay-dark);
    font-size: 14px;
    border-radius: 2px;
    display: none;
  }

  /* --- Results --- */
  .results { margin-top: 40px; display: none; }
  .results.show { display: block; }

  .verdict {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 6px;
  }
  .verdict-label {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .verdict-style {
    font-size: 28px;
    font-weight: 600;
  }
  .verdict-conf {
    font-family: 'Courier New', monospace;
    font-size: 13px;
    color: var(--good);
  }

  .bars { margin: 22px 0 34px; }
  .bar-row {
    display: grid;
    grid-template-columns: 170px 1fr 46px;
    align-items: center;
    gap: 10px;
    margin-bottom: 7px;
    font-size: 13px;
  }
  .bar-name { color: var(--muted); text-transform: capitalize; }
  .bar-track {
    height: 8px;
    background: var(--paper);
    border-radius: 4px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--clay);
    border-radius: 4px;
    transition: width 0.5s ease;
  }
  .bar-pct { text-align: right; color: var(--muted); font-family: 'Courier New', monospace; font-size: 12px; }

  .products-label {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .products {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .product {
    border: 1px solid var(--line);
    border-radius: 2px;
    overflow: hidden;
    text-decoration: none;
    color: var(--ink);
    background: #fff;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    display: block;
  }
  .product:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(44,38,32,0.1); }
  .product img { width: 100%; height: 150px; object-fit: cover; display: block; background: var(--paper); }
  .product-body { padding: 12px 14px; }
  .product-name { font-size: 14px; font-weight: 600; line-height: 1.3; margin-bottom: 4px; }
  .product-price { font-family: 'Courier New', monospace; font-size: 13px; color: var(--clay); }

  @media (max-width: 520px) {
    .products { grid-template-columns: 1fr; }
    h1 { font-size: 30px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Berre.ca — Style Classifier API</div>
  <h1>What's the style of your room?</h1>
  <p class="sub">Upload a photo of a living room. A fine-tuned EfficientNet-B0 model classifies it into one of six interior styles and recommends matching Berre furniture.</p>

  <div class="card">
    <label class="drop" id="dropZone">
      <img id="preview" alt="">
      <div class="drop-label" id="dropText"><strong>Choose a photo</strong> or drag one here</div>
      <input type="file" id="fileInput" accept="image/*">
    </label>

    <button type="button" id="submitBtn" disabled>Classify room style</button>
    <div class="error" id="errorBox"></div>
  </div>

  <div class="results" id="results">
    <div class="verdict">
      <span class="verdict-label">Predicted style</span>
      <span class="verdict-style" id="verdictStyle">—</span>
      <span class="verdict-conf" id="verdictConf"></span>
    </div>

    <div class="bars" id="bars"></div>

    <div class="products-label">Recommended from Berre.ca</div>
    <div class="products" id="products"></div>
  </div>
</div>

<script>
  const API = "http://room-stylist-final-atash.canadacentral.azurecontainer.io:5000/predict";

  const fileInput = document.getElementById('fileInput');
  const dropZone = document.getElementById('dropZone');
  const dropText = document.getElementById('dropText');
  const preview = document.getElementById('preview');
  const submitBtn = document.getElementById('submitBtn');
  const errorBox = document.getElementById('errorBox');
  const results = document.getElementById('results');
  const verdictStyle = document.getElementById('verdictStyle');
  const verdictConf = document.getElementById('verdictConf');
  const bars = document.getElementById('bars');
  const productsEl = document.getElementById('products');

  let selectedFile = null;

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    selectedFile = file;
    submitBtn.disabled = false;
    dropZone.classList.add('has-file');
    dropText.innerHTML = '<strong>' + file.name + '</strong> selected — click again to change';
    const reader = new FileReader();
    reader.onload = e => {
      preview.src = e.target.result;
      preview.style.display = 'block';
    };
    reader.readAsDataURL(file);
  });

  function styleLabel(key) {
    return key.replace(/_/g, ' ');
  }

  submitBtn.addEventListener('click', async () => {
    if (!selectedFile) return;
    errorBox.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Classifying…';

    const formData = new FormData();
    formData.append('image', selectedFile);

    try {
      const res = await fetch(API, { method: 'POST', body: formData });
      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.error || ('Server returned ' + res.status));
      }
      const data = await res.json();
      renderResults(data);
    } catch (err) {
      errorBox.textContent = 'Could not classify: ' + err.message + '. Confirm the Azure container is running.';
      errorBox.style.display = 'block';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Classify room style';
    }
  });

  function renderResults(data) {
    verdictStyle.textContent = styleLabel(data.predicted_style);
    verdictConf.textContent = Math.round(data.confidence * 100) + '% confidence';

    const sorted = Object.entries(data.all_probabilities).sort((a, b) => b[1] - a[1]);
    bars.innerHTML = sorted.map(([name, prob]) => `
      <div class="bar-row">
        <span class="bar-name">${styleLabel(name)}</span>
        <span class="bar-track"><span class="bar-fill" style="width:${Math.round(prob * 100)}%"></span></span>
        <span class="bar-pct">${Math.round(prob * 100)}%</span>
      </div>
    `).join('');

    productsEl.innerHTML = (data.recommended_products || []).map(p => `
      <a class="product" href="${p.url}" target="_blank" rel="noopener">
        ${p.image ? `<img src="${p.image}" alt="${p.name}">` : ''}
        <div class="product-body">
          <div class="product-name">${p.name}</div>
          <div class="product-price">${p.price || ''}</div>
        </div>
      </a>
    `).join('');

    results.classList.add('show');
  }
</script>
</body>
</html>
